[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h-mem"
version = "0.1.0"
description = "Cognitive Agent Memory System (CAMS) - A memory system for AI agents inspired by cognitive neuroscience"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.4.0",
    "numpy>=2.4.1",
    "prometheus-client>=0.23.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "sqlalchemy>=2.0.45",
    "structlog>=25.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hmem"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.14.11",
    "types-pyyaml>=6.0.12.20250915",
]
test = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
# Pytest configuration for h-mem test suite
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
pythonpath = ["src"]

# Output options
addopts = [
    "-ra",                    # Show summary of all test outcomes
    "--strict-markers",       # Treat unregistered markers as errors
    "--strict-config",        # Treat config issues as errors
    "-v",                     # Verbose output
    "--tb=short",            # Short traceback format
]

# Markers for categorizing tests
markers = [
    "acceptance: Acceptance tests based on design.md",
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "slow: Tests that take significant time to run",
    "phase1: Tests for Phase 1 (MVP) features",
    "phase2: Tests for Phase 2 (Semantic layer) features",
    "phase3: Tests for Phase 3 (Intelligence evolution) features",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# Ignore missing imports for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "numpy",
    "prometheus_client",
    "structlog",
]
ignore_missing_imports = true

# SQLAlchemy ORM has dynamic typing that mypy doesn't understand well
[[tool.mypy.overrides]]
module = "hmem.storage.sqlite_semantic"
disable_error_code = ["arg-type", "return-value", "assignment", "operator"]
ignore_missing_imports = true
